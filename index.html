<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tính Chỉ số Thể lực F.I.</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Tính Chỉ số Thể lực F.I.</h1>

        <div class="card">
            <h2>1. Thông tin Phân tầng</h2>
            <div class="input-group">
                <label for="khoi">Khối:</label>
                <select id="khoi">
                    <option value="8">Khối 8</option>
                    <option value="9">Khối 9</option>
                </select>
            </div>
            <div class="input-group">
                <label for="gioitinh">Giới tính:</label>
                <select id="gioitinh">
                    <option value="Nam">Nam</option>
                    <option value="Nu">Nữ</option>
                </select>
            </div>
        </div>

        <div class="card">
            <h2>2. Chỉ số Đo lường (Dữ liệu Thô)</h2>

            <h3>Thể hình (Body Composition)</h3>
            <div class="input-group">
                <label for="chieu_cao">Chiều cao (cm):</label>
                <input type="number" id="chieu_cao" placeholder="Ví dụ: 165">
            </div>
            <div class="input-group">
                <label for="can_nang">Cân nặng (kg):</label>
                <input type="number" id="can_nang" placeholder="Ví dụ: 55">
            </div>

            <h3>Sức mạnh / Tốc độ</h3>
            <div class="input-group">
                <label for="bat_xa">Bật xa (cm):</label>
                <input type="number" id="bat_xa" placeholder="Ví dụ: 180">
            </div>
            <div class="input-group">
                <label for="chay_nhanh">Chạy nhanh (giây):</label>
                <input type="number" step="0.1" id="chay_nhanh" placeholder="Ví dụ: 12.5">
            </div>
            <div class="input-group">
                <label for="gap_bung">Gập bụng (lần/30s):</label>
                <input type="number" id="gap_bung" placeholder="Ví dụ: 30">
            </div>

            <h3>Sức bền / Linh hoạt</h3>
            <div class="input-group">
                <label for="chay_ben">Chạy bền (phút:giây):</label>
                <input type="text" id="chay_ben" placeholder="Ví dụ: 8:30" value="8:00">
            </div>
            <div class="input-group">
                <label for="gap_than">Đứng gập thân (cm):</label>
                <input type="number" id="gap_than" placeholder="Ví dụ: 15">
            </div>

            <button id="btn_tinh_fi">Tính Chỉ số F.I.</button>
        </div>

        <div id="ket-qua" class="card result-card" style="display: none;">
            <h2>3. Kết quả Chỉ số F.I.</h2>
            <p>Chỉ số F.I. của bạn: <span id="fi_score"></span></p>
            <p>Phân loại: <span id="phan_loai_fi"></span></p>
            <h3>Gợi ý Cải thiện:</h3>
            <ul id="goi_y_cai_thien"></ul>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
